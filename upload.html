<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Upload & Manage Journals</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
    </script>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 30px auto;
            padding: 20px;
            background: #f9fafc;
        }
        h2, h3 { margin-top: 0; }
        .card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
            margin-bottom: 25px;
        }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; }
        input, select {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            background: #007bff;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        button:disabled { background: #ccc; cursor: not-allowed; }
        .btn-danger { background: #dc3545; }
        .btn-danger:hover { background: #c82333; }
        #message {
            margin-top: 15px;
            padding: 10px;
            border-radius: 4px;
        }
        .error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        #login-section {
            background: #fff3cd;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
        }
        .inline-login {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }
        .inline-login input { flex: 1; min-width: 120px; }
        .inline-login button { width: auto; flex: 0 0 auto; }
        .hint { font-size: 12px; color: #666; margin-top: 8px; }

        .journal-list { margin-top: 20px; }
        .series-group { margin-bottom: 25px; }
        .series-title {
            font-size: 1.2rem;
            font-weight: bold;
            background: #e9ecef;
            padding: 6px 12px;
            border-radius: 4px;
            margin-bottom: 10px;
        }
        .journal-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 12px;
            background: #f8f9fa;
            border-radius: 4px;
            margin-bottom: 8px;
            border-left: 4px solid #007bff;
        }
        .journal-info { flex: 1; margin-right: 15px; }
        .journal-title { font-weight: 600; }
        .journal-meta { font-size: 0.9rem; color: #555; }
        .journal-actions {
            display: flex;
            gap: 8px;
            flex-shrink: 0;
        }
        .journal-actions button {
            padding: 5px 12px;
            font-size: 0.85rem;
            width: auto;
        }
        .preview-link {
            color: #007bff;
            text-decoration: underline;
            cursor: pointer;
            margin-right: 10px;
        }
        .empty-msg { color: #888; font-style: italic; }
        @media (max-width: 600px) {
            .journal-item { flex-wrap: wrap; }
            .journal-actions { margin-top: 8px; width: 100%; justify-content: flex-end; }
        }
    </style>
</head>
<body>

    <h2>📚 Upload & Manage Journals</h2>

    <!-- Login Section -->
    <div id="login-section">
        <p><strong>Status:</strong> <span id="auth-status">Checking…</span></p>
        <div id="login-form" style="display: none;">
            <div class="inline-login">
                <input type="email" id="email" placeholder="Email" />
                <input type="password" id="password" placeholder="Password" />
                <button id="login-btn">Login / Sign Up</button>
            </div>
            <p class="hint">(If account doesn't exist, it will be created automatically)</p>
        </div>
    </div>

    <!-- Upload Form -->
    <div id="upload-section" style="display: none;" class="card">
        <h3>Upload New Journal</h3>
        <form id="upload-form">
            <div class="form-group">
                <label for="title">Journal Title *</label>
                <input type="text" id="title" placeholder="e.g. Advances in Quantum Physics" required />
            </div>
            <div class="form-group">
                <label for="series">Series *</label>
                <select id="series" required>
                    <option value="A">Series A</option>
                    <option value="B">Series B</option>
                    <option value="C">Series C</option>
                </select>
            </div>
            <div class="form-group">
                <label for="year">Year Published *</label>
                <input type="number" id="year" min="1900" max="2100" value="2026" required />
            </div>
            <div class="form-group">
                <label for="file">PDF File *</label>
                <input type="file" id="file" accept=".pdf" required />
            </div>
            <button type="submit" id="submit-btn">Upload Journal</button>
            <div id="message"></div>
        </form>
    </div>

    <!-- Journal List -->
    <div id="list-section" style="display: none;" class="card">
        <h3>Your Journals</h3>
        <div id="journal-list-container">
            <p class="empty-msg">Loading your journals…</p>
        </div>
    </div>

    <script>
        // ================================================================
        // 🔑 SUPABASE CREDENTIALS (EDIT THESE)
        // ================================================================
        const SUPABASE_URL = 'https://mlsxjdwvswpufgstahoz.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_EjuCbiZujrB_drsnN51psQ_KPpsIolW';
        const STORAGE_BUCKET = 'knasjournals';        // <-- your bucket name
        const SIGNED_URL_EXPIRY = 60;                 // seconds
        // ================================================================

        let supabaseClient = null;
        let currentUser = null;

        // DOM refs
        const authStatus = document.getElementById('auth-status');
        const loginForm = document.getElementById('login-form');
        const uploadSection = document.getElementById('upload-section');
        const listSection = document.getElementById('list-section');
        const messageDiv = document.getElementById('message');
        const submitBtn = document.getElementById('submit-btn');
        const listContainer = document.getElementById('journal-list-container');

        // ----------------------------------------------------------------
        //  INIT
        // ----------------------------------------------------------------
        async function initializeApp() {
            while (!window.supabase) {
                await new Promise(r => setTimeout(r, 100));
            }
            supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            return supabaseClient;
        }

        // ----------------------------------------------------------------
        //  AUTH
        // ----------------------------------------------------------------
        async function checkAuth() {
            if (!supabaseClient) return null;
            const { data: { user } } = await supabaseClient.auth.getUser();
            if (user) {
                authStatus.innerHTML = `✅ Logged in as <strong>${user.email}</strong>`;
                loginForm.style.display = 'none';
                uploadSection.style.display = 'block';
                listSection.style.display = 'block';
                currentUser = user;
                loadJournals();
                return user;
            } else {
                authStatus.innerHTML = '❌ Not logged in.';
                loginForm.style.display = 'block';
                uploadSection.style.display = 'none';
                listSection.style.display = 'none';
                currentUser = null;
                return null;
            }
        }

        // ----------------------------------------------------------------
        //  BOOT
        // ----------------------------------------------------------------
        initializeApp()
            .then(() => checkAuth())
            .catch(err => {
                authStatus.innerHTML = `⚠️ Init error: ${err.message}`;
            });

        // ----------------------------------------------------------------
        //  LOGIN / SIGNUP
        // ----------------------------------------------------------------
        document.getElementById('login-btn').addEventListener('click', async () => {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();
            if (!email || !password) {
                alert('Please enter email and password.');
                return;
            }

            let { error } = await supabaseClient.auth.signInWithPassword({ email, password });

            if (error) {
                if (error.message.includes('Invalid login credentials')) {
                    const { error: signUpError } = await supabaseClient.auth.signUp({ email, password });
                    if (signUpError) {
                        alert('Sign-up failed: ' + signUpError.message);
                        return;
                    }
                    alert('Account created! Please log in again.');
                    const { error: retryError } = await supabaseClient.auth.signInWithPassword({ email, password });
                    if (retryError) {
                        alert('Please check your email to confirm, then log in.');
                        return;
                    }
                } else {
                    alert('Login error: ' + error.message);
                    return;
                }
            }

            await checkAuth();
            document.getElementById('password').value = '';
        });

        // ----------------------------------------------------------------
        //  LOAD JOURNALS (grouped by series) with signed URLs for preview
        // ----------------------------------------------------------------
        async function loadJournals() {
            if (!currentUser) return;
            listContainer.innerHTML = '<p class="empty-msg">Loading…</p>';

            try {
                const { data, error } = await supabaseClient
                    .from('journals')
                    .select('*')
                    .eq('user_id', currentUser.id)
                    .order('series', { ascending: true })
                    .order('year_published', { ascending: false });

                if (error) throw new Error(error.message);

                if (!data || data.length === 0) {
                    listContainer.innerHTML = '<p class="empty-msg">You haven\'t uploaded any journals yet.</p>';
                    return;
                }

                // Group by series
                const groups = { A: [], B: [], C: [] };
                data.forEach(j => {
                    if (groups[j.series]) groups[j.series].push(j);
                    else groups[j.series] = [j];
                });

                let html = '';
                for (const series of ['A', 'B', 'C']) {
                    const items = groups[series] || [];
                    if (items.length === 0) continue;
                    html += `<div class="series-group">`;
                    html += `<div class="series-title">Series ${series}</div>`;
                    for (const j of items) {
                        // Generate a signed URL for each file
                        const { data: signedData, error: signedError } = await supabaseClient.storage
                            .from(STORAGE_BUCKET)
                            .createSignedUrl(j.file_path, SIGNED_URL_EXPIRY);

                        let previewUrl = '#';
                        if (signedError) {
                            console.warn('Signed URL error:', signedError);
                            previewUrl = '#'; // fallback
                        } else {
                            previewUrl = signedData.signedUrl;
                        }

                        html += `
                            <div class="journal-item" data-id="${j.id}">
                                <div class="journal-info">
                                    <div class="journal-title">${escapeHtml(j.title)}</div>
                                    <div class="journal-meta">${j.year_published} &bull; ${escapeHtml(j.file_path.split('/').pop())}</div>
                                </div>
                                <div class="journal-actions">
                                    <a href="${previewUrl}" target="_blank" class="preview-link">📄 Preview</a>
                                    <button class="btn-danger delete-btn" data-id="${j.id}" data-path="${j.file_path}">Delete</button>
                                </div>
                            </div>
                        `;
                    }
                    html += `</div>`;
                }

                listContainer.innerHTML = html;

                // Attach delete events
                document.querySelectorAll('.delete-btn').forEach(btn => {
                    btn.addEventListener('click', async (e) => {
                        const id = btn.dataset.id;
                        const filePath = btn.dataset.path;
                        if (confirm('Delete this journal permanently?')) {
                            await deleteJournal(id, filePath);
                        }
                    });
                });

            } catch (err) {
                listContainer.innerHTML = `<p class="error">Error loading journals: ${err.message}</p>`;
            }
        }

        // ----------------------------------------------------------------
        //  DELETE JOURNAL
        // ----------------------------------------------------------------
        async function deleteJournal(id, filePath) {
            try {
                // Delete from storage
                const { error: storageError } = await supabaseClient.storage
                    .from(STORAGE_BUCKET)
                    .remove([filePath]);

                if (storageError) {
                    console.warn('Storage delete error (file may already be missing):', storageError);
                }

                // Delete from table
                const { error: dbError } = await supabaseClient
                    .from('journals')
                    .delete()
                    .eq('id', id);

                if (dbError) throw new Error(dbError.message);

                loadJournals();
                showTemporaryMessage('✅ Journal deleted successfully.', 'success');

            } catch (err) {
                alert('Delete failed: ' + err.message);
            }
        }

        // ----------------------------------------------------------------
        //  UPLOAD
        // ----------------------------------------------------------------
        document.getElementById('upload-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            messageDiv.className = '';
            messageDiv.textContent = '';
            submitBtn.disabled = true;
            submitBtn.textContent = 'Uploading…';

            try {
                const { data: { user } } = await supabaseClient.auth.getUser();
                if (!user) throw new Error('You must be logged in to upload.');

                const title = document.getElementById('title').value.trim();
                const series = document.getElementById('series').value;
                const year = parseInt(document.getElementById('year').value, 10);
                const fileInput = document.getElementById('file');
                const file = fileInput.files[0];

                if (!title) throw new Error('Please enter a title.');
                if (!file) throw new Error('Please select a PDF file.');
                if (file.type !== 'application/pdf' && !file.name.toLowerCase().endsWith('.pdf')) {
                    throw new Error('File must be a PDF.');
                }

                const timestamp = Date.now();
                const filePath = `${user.id}/${timestamp}_${file.name}`;

                // Upload to Storage
                const { error: uploadError } = await supabaseClient.storage
                    .from(STORAGE_BUCKET)
                    .upload(filePath, file);

                if (uploadError) throw new Error(`Storage upload failed: ${uploadError.message}`);

                // Insert metadata
                const { error: insertError } = await supabaseClient
                    .from('journals')
                    .insert({
                        title,
                        series,
                        year_published: year,
                        file_path: filePath,
                        user_id: user.id,
                    });

                if (insertError) {
                    await supabaseClient.storage.from(STORAGE_BUCKET).remove([filePath]);
                    throw new Error(`Database insert failed: ${insertError.message}`);
                }

                messageDiv.className = 'success';
                messageDiv.textContent = '✅ Journal uploaded successfully!';
                document.getElementById('upload-form').reset();
                document.getElementById('year').value = '2026';
                loadJournals();

            } catch (err) {
                messageDiv.className = 'error';
                messageDiv.textContent = `❌ ${err.message}`;
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Upload Journal';
            }
        });

        // ----------------------------------------------------------------
        //  HELPERS
        // ----------------------------------------------------------------
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function showTemporaryMessage(msg, type) {
            const old = document.getElementById('temp-msg');
            if (old) old.remove();
            const div = document.createElement('div');
            div.id = 'temp-msg';
            div.className = type;
            div.textContent = msg;
            listContainer.prepend(div);
            setTimeout(() => div.remove(), 4000);
        }

        // ----------------------------------------------------------------
        //  AUTO-REFRESH AUTH
        // ----------------------------------------------------------------
        if (supabaseClient) {
            supabaseClient.auth.onAuthStateChange(() => {
                checkAuth();
            });
        }
    </script>
</body>
</html>
